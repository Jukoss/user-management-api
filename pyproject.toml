[project]
name = "user-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jukoss", email = "tusyukv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
user-management-api = "user_management_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
